[project]
name = "support-ticket-triage"
version = "0.1.0"
description = "A simple support ticket classifier built with Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
